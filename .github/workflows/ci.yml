# CI: runs on every pull request, and on pushes to main (e.g. after a merge).
# Feature branches are checked through their pull request, so they do not run twice.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Pinned by digest: Trivy's release tags were hijacked in March 2026 (CVE-2026-33634);
  # 0.69.3 predates that and a digest cannot be moved.
  TRIVY: aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
  # Built-image scan: OS and Python packages with a fix available, HIGH and CRITICAL only.
  TRIVY_IMAGE_ARGS: image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Pinned: a new ruff release can change formatting and fail CI with no code change.
      - run: pip install ruff==0.17.1

      # Full lint: ruff's rule set, with project exceptions in ruff.toml.
      - run: >
          ruff check
          auth_service llm_service ocr_service orchestrator_service
          rag_service ui_service langfuse_service tests

      # Code must match `ruff format` (settings in ruff.toml). Fix locally with: ruff format <dirs>
      - run: >
          ruff format --check
          auth_service llm_service ocr_service orchestrator_service
          rag_service ui_service langfuse_service tests

  # Per service, against its real libraries: pyright (pyrightconfig.json), then the unit
  # tests in <service>/tests (fakes stand in for Qdrant, MinIO, the LLM and other services).
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: auth_service, python: "3.11" }
          - { service: orchestrator_service, python: "3.12" }
          - { service: ui_service, python: "3.12" }
          # CPU-only torch: same API as the CUDA build, a fraction of the download.
          - { service: rag_service, python: "3.12", pre: "torch --index-url https://download.pytorch.org/whl/cpu" }
          - { service: ocr_service, python: "3.12", pre: "torch torchvision --index-url https://download.pytorch.org/whl/cpu" }
          # llm_service gets these from the lmsysorg/sglang base image, not requirements.txt.
          # Its transformers 5.3.0 is fixed by the SGLang release; the three advisories need an
          # untrusted model repo or save_pretrained, and llm_service only loads its own model.
          - service: llm_service
            python: "3.12"
            extra: "fastapi==0.135.3 pydantic==2.12.5 httpx==0.28.1 transformers==5.3.0 openai==2.6.1"
            audit_ignore: "--ignore-vuln PYSEC-2026-2290 --ignore-vuln PYSEC-2026-3929 --ignore-vuln PYSEC-2026-4174"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            ${{ matrix.service }}/requirements.txt
            requirements-test.txt

      - name: Install libraries
        run: |
          if [ -n "${{ matrix.pre }}" ]; then pip install ${{ matrix.pre }}; fi
          pip install pyright==1.1.414 -r requirements-test.txt             -r ${{ matrix.service }}/requirements.txt ${{ matrix.extra }}

      - name: Type check
        run: pyright --pythonpath "$(which python)" ${{ matrix.service }}/src

      - name: Unit tests
        working-directory: ${{ matrix.service }}
        run: python -m pytest -q

      # Every installed package, including the ones pulled in indirectly, against the
      # Python vulnerability database. Fix by pinning a fixed version in requirements.txt.
      - name: Vulnerable packages
        run: |
          pip install pip-audit==2.10.1
          pip-audit --progress-spinner off ${{ matrix.audit_ignore }}

  # Passwords, tokens and keys committed anywhere in the git history.
  # Known findings that were already dealt with are listed in .gitleaksignore.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0
          git /repo --no-banner --redact --gitleaks-ignore-path /repo/.gitleaksignore

  # Trivy: known vulnerabilities in the pinned requirements, and Dockerfile mistakes.
  # Accepted findings are listed in .trivyignore.
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - run: >
          docker run --rm -v "$PWD:/repo" -w /repo $TRIVY
          fs . --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1
          --ignorefile .trivyignore --skip-dirs .git

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # .env is not in git, so validate with the example values instead.
      - run: docker compose --env-file .env.example config -q

  # Lint every Dockerfile (fast, no build).
  dockerfile-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ui_service, auth_service, orchestrator_service, rag_service, ocr_service, llm_service]
    steps:
      - uses: actions/checkout@v5
      - run: >
          docker buildx build --check
          -f ${{ matrix.service }}/Dockerfile
          ${{ matrix.service == 'ui_service' && 'ui_service' || '.' }}

  # Fully build the images that fit on a GitHub runner and are not built by `integration`.
  # ocr_service (~16 GB) and llm_service (~64 GB) are too big, so they only get dockerfile-check.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: orchestrator_service, image: ahr-orchestrator }
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - run: docker compose --env-file .env.example build ${{ matrix.service }}

      - name: Scan image
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock $TRIVY $TRIVY_IMAGE_ARGS
          ${{ matrix.image }}:latest

  # The non-GPU part of the stack running together: auth_service, ui_service, rag_service
  # (CPU models), Qdrant and MinIO, driven over HTTP by tests/integration.
  integration:
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f docker-compose.yml -f tests/integration/docker-compose.ci.yml --env-file .env.example
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      # --no-deps: ui_service would otherwise also start ocr/orchestrator/llm (GPU).
      - name: Start the stack
        run: |
          $COMPOSE up -d --wait minio qdrant
          $COMPOSE up -d --build --no-deps --wait --wait-timeout 900 auth_service rag_service ui_service

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r tests/integration/requirements.txt

      - name: Integration tests
        working-directory: tests/integration
        run: python -m pytest -v

      - name: Scan images
        run: |
          for image in ahr-auth ahr-rag ahr-ui; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock $TRIVY $TRIVY_IMAGE_ARGS $image:latest
          done

      - name: Container logs
        if: failure()
        run: $COMPOSE logs --no-color --tail 200 auth_service rag_service ui_service
